<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Stylized hanging pothos illustration">
  <rect width="320" height="320" fill="#f0ead9"/>
  <defs>
    <path id="heart" d="M0,-8 C8,-20 26,-10 0,16 C-26,-10 -8,-20 0,-8 Z"/>
  </defs>
  <!-- hanging pot -->
  <path d="M130 20 L160 64 M190 20 L160 64" stroke="#7c8471" stroke-width="4" fill="none"/>
  <path d="M116 64 L204 64 L192 112 L128 112 Z" fill="#a85a3f"/>
  <rect x="110" y="56" width="100" height="12" rx="6" fill="#b5654a"/>
  <!-- vines -->
  <g stroke="#2b5137" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M138 112 C120 160 128 210 108 258"/>
    <path d="M160 112 C164 170 152 220 162 282"/>
    <path d="M184 112 C204 158 196 208 218 252"/>
  </g>
  <!-- leaves along the vines -->
  <g>
    <use href="#heart" fill="#3e6b4a" transform="translate(126 148) scale(1.25) rotate(15)"/>
    <use href="#heart" fill="#d9b23c" transform="translate(120 196) scale(1.1) rotate(-12)"/>
    <use href="#heart" fill="#33623f" transform="translate(108 244) scale(1.3) rotate(8)"/>
    <use href="#heart" fill="#4a7d58" transform="translate(162 160) scale(1.2) rotate(-6)"/>
    <use href="#heart" fill="#3e6b4a" transform="translate(154 214) scale(1.35) rotate(14)"/>
    <use href="#heart" fill="#d9b23c" transform="translate(163 266) scale(1.05) rotate(-10)"/>
    <use href="#heart" fill="#33623f" transform="translate(196 146) scale(1.15) rotate(-16)"/>
    <use href="#heart" fill="#4a7d58" transform="translate(206 198) scale(1.25) rotate(10)"/>
    <use href="#heart" fill="#3e6b4a" transform="translate(220 240) scale(1.1) rotate(-4)"/>
  </g>
</svg>
