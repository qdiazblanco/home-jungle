<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kipe's Home Jungle</title>
  <meta name="description" content="A living encyclopedia and day-to-day care tracker for our houseplants.">
  <meta name="theme-color" content="#3e6b4a">

  <!-- Pre-paint theme stamp (a tiny inline copy of js/theme.js, which owns
       the live logic) — avoids a light flash on dark systems. -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('digital-garden:settings') || '{}');
      var t = s.theme === 'light' || s.theme === 'dark'
        ? s.theme
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      if (t === 'dark') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#181c16');
      }
    } catch (e) { /* default (light) stands */ }
  </script>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Preload the whole module graph so the first uncached load fetches in
       parallel instead of discovering imports level by level. -->

  <link rel="modulepreload" href="js/router.js">
  <link rel="modulepreload" href="js/store.js">

        <svg class="brand-leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c0-6 1-10 4-13 2.4-2.4 5-3 6-3 0 1-.6 3.6-3 6-3 3-7 4-7 10z" fill="currentColor"/><path d="M12 22c0-6-1-10-4-13C5.6 6.6 3 6 2 6c0 1 .6 3.6 3 6 3 3 7 4 7 10z" fill="currentColor" opacity=".55"/></svg>
