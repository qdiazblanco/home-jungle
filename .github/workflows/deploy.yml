name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Every in-app write pushes a commit, so deploys arrive in bursts.
# Collapse them to the newest build instead of letting runs collide.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Version = hash of the app shell (everything except data/). Data-only
      # commits — every in-app watering — leave sw.js byte-identical, so
      # phones are not prompted to "update" after each logged event.
      - name: Stamp service worker cache version
        run: |
          HASH=$(git ls-files | grep -v '^data/' | sort | xargs sha256sum | sha256sum | cut -c1-12)
          sed -i "s/__VERSION__/${HASH}/" sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
