name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The runner's preinstalled Node runs the dependency-free suite —
      # no setup-node action needed.
      # Runs the suite twice (UTC and Europe/Madrid) to catch timezone
      # drift between the browser and the Phase 2 Action runner.
      - name: Run tests
        run: npm test
