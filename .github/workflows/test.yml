name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs the suite twice (UTC and Europe/Madrid) to catch timezone
      # drift between the browser and the Phase 2 Action runner.
      - name: Run tests
        run: npm test
