name: Daily care notifications

on:
  schedule:
    # Two crons so the digest lands at ~08:00 Madrid YEAR-ROUND: 06:00 UTC is
    # 08:00 in summer (CEST), 07:00 UTC in winter (CET). The script skips a
    # run before 08:00 local and dedups by the state file's date, so a cron
    # that GitHub fires hours late (or drops) still gets the digest out
    # (NOTIFY_DST_GUARD). Scheduled runs only fire on the default branch.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      ping:
        description: Send a test message even when nothing is due
        type: boolean
        default: false

permissions:
  contents: read

# A manual test must never interleave with the scheduled run — they share
# the dedup state. Queue instead of cancelling.
concurrency:
  group: notify
  cancel-in-progress: false

env:
  # Same-day semantics as the phones — shared/dates.js derives the calendar
  # day from local time, and the dual-TZ test suite guarantees parity.
  TZ: Europe/Madrid

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The runner's preinstalled Node runs the dependency-free script
      # directly — no setup-node action needed.
      - name: Checkout
        uses: actions/checkout@v5

      # Dedup state for month-long info notices ("October is coming") so
      # they fire once, not thirty times. Eviction is harmless: worst case
      # a single repeated notice.
      - name: Restore notification state
        uses: actions/cache/restore@v5
        with:
          path: .notify-state.json
          key: notify-state-${{ github.run_id }}
          restore-keys: |
            notify-state-

      # github.repository is available on every trigger (schedule included),
      # unlike event payload fields.
      - name: Compute site URL
        run: echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Build and send the digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_DST_GUARD: ${{ github.event_name == 'schedule' }}
          NOTIFY_PING: ${{ inputs.ping == true }}
        run: node scripts/notify.js

      # hashFiles guard: before the Telegram secrets exist (or after an
      # early crash) the script writes no state file — saving nothing would
      # fail the step with a warning.
      - name: Save notification state
        if: ${{ always() && hashFiles('.notify-state.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .notify-state.json
          key: notify-state-${{ github.run_id }}
